name: Portfolio CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.event_name == 'push' && 'production' || github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-and-deploy:
    name: Validate and deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build pull request
        if: github.event_name == 'pull_request'
        run: pnpm build

      - name: Install Vercel CLI
        if: github.event_name == 'push'
        run: npm install --global vercel@64.3.1

      - name: Pull production settings
        if: github.event_name == 'push'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo '::error::Configure the VERCEL_TOKEN repository secret.'; exit 1; }
          test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        if: github.event_name == 'push'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Check types
        run: pnpm typecheck

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test production build
        run: pnpm test:e2e

      - name: Save failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Confirm this is still the latest main commit
        if: github.event_name == 'push'
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "Skipped superseded commit $GITHUB_SHA; main is $latest_sha." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy tested artifact
        if: github.event_name == 'push' && steps.latest.outputs.current == 'true'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel deploy --prebuilt --prod --yes --json --non-interactive --meta "portfolioCommitSha=$GITHUB_SHA" --token="$VERCEL_TOKEN" > "$RUNNER_TEMP/portfolio-deployment.json"
          deployment_url=$(node -e 'const fs = require("node:fs"); const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); const url = result.deployment?.url; if (result.status !== "ok" || !url) process.exit(1); console.log(new URL(url).href);' "$RUNNER_TEMP/portfolio-deployment.json")
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          {
            echo '### Portfolio deployed'
            echo "Commit: $GITHUB_SHA"
            echo "Deployment: $deployment_url"
            echo 'Website: https://itsdraggodeidad-portfolio.vercel.app'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check public routes
        if: steps.deploy.outcome == 'success'
        run: |
          for path in / /es /en /es/proyectos/pwa-utt /en/proyectos/pwa-utt /es/proyectos/secure-transfer /en/proyectos/secure-transfer /es/proyectos/classroom-github /en/proyectos/classroom-github /icon.svg; do
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 30 --output /dev/null "https://itsdraggodeidad-portfolio.vercel.app$path"
          done
